name: Fetch news, filings and analyst actions

on:
  schedule:
    # GitHub cron is UTC and ignores daylight saving, and GitHub often starts jobs 30-65 minutes late.
    # Each slot is listed at several hours; the scripts only work inside their ET window.
    # The later slots (about 8:05 AM and 5:40 PM ET) take the "final" snapshot that the Claude tasks
    # read, so earnings released just before 8 AM or just after the close are included.
    - cron: "45 10,11,12 * * 1-5"   # morning first pass, about 6:45 AM ET
    - cron: "5 12,13 * * 1-5"       # morning final, about 8:05 AM ET
    - cron: "30 20,21,22 * * 1-5"   # recap first pass, about 4:30 PM ET
    - cron: "40 21,22 * * 1-5"      # recap final, about 5:40 PM ET
  workflow_dispatch:
    inputs:
      mode:
        description: "recap or morning"
        required: true
        default: recap
        type: choice
        options: [recap, morning]

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - name: Work out which run this is
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=${{ inputs.mode }} --force" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +%H)" -lt 14 ]; then
            echo "args=morning --only-if-et-hour 8" >> "$GITHUB_OUTPUT"
          else
            echo "args=recap --only-if-et-hour 16" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch SEC filings
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/fetch_filings.py ${{ steps.pick.outputs.args }}
      - name: Fetch headlines, official releases and analyst actions
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BLS_CONTACT: ${{ secrets.BLS_CONTACT || secrets.SEC_CONTACT }}
        run: python scripts/fetch_news.py ${{ steps.pick.outputs.args }}
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in filings news; do if [ -d "$d" ]; then git add "$d"; fi; done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "News and filings $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
